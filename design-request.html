<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Request — Geerdyverse</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --void-black:#0b0710;
      --nebula-purple:#221324;
      --paper-light:#fffef8;
      --accent-violet:#7c5cff;
      --accent-rose:#ff7ac4;
      --text-dark:#2b163a;
      --text-muted:#6e5b7b;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:'Inter',system-ui,sans-serif;
      background:linear-gradient(180deg,var(--void-black),var(--nebula-purple));
      color:var(--paper-light);
      line-height:1.6;
    }

    .stars{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.3), transparent);
      background-size:260px 260px;
      animation:drift 160s linear infinite;
    }

    @keyframes drift{
      from{transform:translateY(0);}
      to{transform:translateY(-350px);}
    }

    body>*{ position:relative; z-index:1; }

    .nav{
      position:sticky;
      top:0;
      background:rgba(11,7,16,.85);
      backdrop-filter:blur(10px);
    }
    .nav-inner{
      max-width:1100px;
      margin:auto;
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .logo{
      font-family:'Poppins',sans-serif;
      font-weight:600;
    }
    .nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:.9rem;
    }

    .hero{
      text-align:center;
      padding:90px 20px 40px;
    }
    .hero h1{
      font-family:'Poppins',sans-serif;
      font-size:2.4rem;
    }
    .hero p{
      max-width:650px;
      margin:auto;
      color:#e2e2e2;
    }

    .panel{
      background:var(--paper-light);
      color:var(--text-dark);
      max-width:800px;
      margin:60px auto;
      padding:50px;
      border-radius:20px;
    }

    .panel h2{
      font-family:'Poppins',sans-serif;
      margin-top:0;
      text-align:center;
    }

    label{
      display:block;
      font-weight:500;
      margin:14px 0 6px;
    }

    input, textarea, select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:.95rem;
      margin-bottom:10px;
      font-family:'Inter',sans-serif;
    }

    textarea{
      height:130px;
      resize:vertical;
    }

    .cta{
      text-align:center;
      margin-top:30px;
    }

    .cta-btn{
      padding:14px 34px;
      border:none;
      border-radius:28px;
      background:linear-gradient(135deg,var(--accent-violet),var(--accent-rose));
      color:white;
      font-size:.95rem;
      cursor:pointer;
    }

    footer{
      text-align:center;
      padding:40px 20px;
      font-size:.8rem;
      color:#aaa;
    }
  </style>
</head>

<body>

<div class="stars"></div>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">Geerdyverse</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="academy.html">Academy</a>
      <a href="writing-galaxy.html">Writing Galaxy</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Submit a Design Request</h1>
  <p>Share your idea, your style preference, and the purpose of the design. You will receive a reply within 24 hours.</p>
</section>

<section class="panel">

  <h2>Design Request Form</h2>

  <form onsubmit="submitForm(event)">

    <label>Your Name</label>
    <input type="text" name="name" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label>Design Type</label>
    <select name="design_type" required>
      <option value="">Select a type</option>
      <option>Logo Design</option>
      <option>Book Cover</option>
      <option>Poster / Banner</option>
      <option>Album Cover</option>
      <option>Social Media Graphics</option>
      <option>UI Elements</option>
      <option>Other (Explain Below)</option>
    </select>

    <label>Project Description</label>
    <textarea name="description" placeholder="Explain what you need. Include mood, colors, style, vibe, inspirations." required></textarea>

    <label>Reference Links (If any)</label>
    <textarea name="references" placeholder="Paste links to images, moodboards, examples, etc."></textarea>

    <label>Deadline (Optional)</label>
    <input type="text" name="deadline" placeholder="Example: 3 days, 1 week, specific date">

    <div class="cta">
      <button class="cta-btn" type="submit">Submit Design Request</button>
    </div>

  </form>

</section>

<footer>
  <p>© 2025 Geerdyverse • Design Request</p>
</footer>

<script>
async function submitForm(event) {
  event.preventDefault();

  const form = event.target;

  const payload = {
    name: form.name.value,
    email: form.email.value,
    design_type: form.design_type.value,
    description: form.description.value,
    references: form.references.value,
    deadline: form.deadline.value
  };

  try {
    const response = await fetch("https://geerdyverse-backend.onrender.com/api/design-requests", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (response.ok) {
      alert("Your design request has been submitted successfully!");
      form.reset();
    } else {
      alert(data.error || "Something went wrong. Please try again.");
    }

  } catch (err) {
    alert("Network error. Check your internet or try again later.");
    console.error(err);
  }
}
</script>

</body>
</html>
