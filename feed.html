<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Starship — Feed</title>

<style>
/* ===============================
   BASE
================================ */
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  font-family: 'Poppins', sans-serif;
  color: #eafff3;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* ===============================
   TRANSITION CONTAINER
================================ */
.scene {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: auto;
}

/* ===============================
   SIDE MODULES
================================ */
.module {
  position: fixed;
  top: 20%;
  width: 220px;
  padding: 18px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(143,168,106,0.45);
  border-radius: 18px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 20px rgba(143,168,106,0.35);
  transition: transform 1.8s cubic-bezier(.2,.8,.2,1);
}

.left {
  left: 40px;
  transform: translateX(0);
}

.right {
  right: 40px;
  transform: translateX(0);
}

/* Slide out */
.animate .left {
  transform: translateX(-320px);
}

.animate .right {
  transform: translateX(320px);
}

/* ===============================
   CENTER FEED
================================ */
.feed-core {
  will-change: transform;
  position: fixed;
  top: 50%;
  left: 50%;
  width: min(1100px, 92%);
  height: 78%;
  transform: translate(-50%, -50%) scale(0.75);
  padding: 28px;
  background: rgba(10,14,10,0.4);
  border: 1px solid rgba(143,168,106,0.35);
  border-radius: 26px;
  box-shadow:
    0 0 40px rgba(143,168,106,0.35),
    inset 0 0 25px rgba(143,168,106,0.15);
  transition: transform 2.1s cubic-bezier(.2,.8,.2,1);
  pointer-events: auto;
  overflow-y: auto;
  z-index: 2;
}

/* Zoom forward */
.animate .feed-core {
  transform: translate(-50%, -50%) scale(1);
}

/* ===============================
   POSTS
================================ */
.post {
  background: rgba(20,26,18,0.55);
  padding: 20px;
  border-radius: 16px;
  border: 1px solid rgba(143,168,106,0.4);
  margin-bottom: 20px;
  cursor: pointer;
}

.username {
  font-weight: 600;
  color: rgba(170,220,180,0.95);
  cursor: pointer;
}

.username:hover {
  text-decoration: underline;
}

.post-text {
  margin: 10px 0 14px;
  line-height: 1.5;
}

/* ===============================
   ACTIONS
================================ */
.actions {
  display: flex;
  gap: 14px;
  font-size: 0.9rem;
}

.actions button {
  background: rgba(143,168,106,0.25);
  border: 1px solid rgba(143,168,106,0.4);
  color: #eafff3;
  border-radius: 12px;
  padding: 6px 12px;
  cursor: pointer;
}

/* ===============================
   LOAD MORE
================================ */
.load-more {
  text-align: center;
  margin: 20px 0;
}

.load-more button {
  padding: 10px 22px;
  border-radius: 18px;
  background: rgba(143,168,106,0.4);
  border: 1px solid rgba(143,168,106,0.5);
  color: #eafff3;
  cursor: pointer;
}

/* ===============================
   EXIT BUTTON
================================ */
.exit {
  position: fixed;
  top: 30px;
  right: 40px;
  z-index: 4;
}

.exit button {
  padding: 10px 18px;
  border-radius: 16px;
  background: rgba(143,168,106,0.35);
  border: 1px solid rgba(143,168,106,0.5);
  color: #eafff3;
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="scene" id="scene">
  <div class="module left">
    <h3>Ship Systems</h3>
    <p>Reactor: Stable</p>
    <p>Hull: 100%</p>
  </div>

  <div class="module right">
    <h3>Navigation</h3>
    <p>Sector: Writing Galaxy</p>
    <p>Status: Drifting</p>
  </div>

  <div class="feed-core" id="feed"></div>

<div class="exit">
  <button onclick="exitFeed()">Return to Cockpit</button>
</div>

<script>
/* ===============================
   STARFIELD (CENTER-OUT)
================================ */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let width, height, centerX, centerY;
let stars = [];
const STAR_COUNT = 300;
const SPEED = 6;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2;

  stars = Array.from({ length: STAR_COUNT }, createStar);
}

function createStar() {
  return {
    x: (Math.random() - 0.5) * width,
    y: (Math.random() - 0.5) * height,
    z: Math.random() * width
  };
}

function update() {
  const brightness = 255;
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, width, height);

  for (const star of stars) {
    star.z -= SPEED;

    if (star.z <= 1) {
      Object.assign(star, createStar(), { z: width });
    }

    const scale = width / star.z;
    const x = star.x * scale + centerX;
    const y = star.y * scale + centerY;

    if (x < 0 || x > width || y < 0 || y > height) continue;

    const intensity = 1 - star.z / width;
    const size = Math.max(1.2, intensity * 3.5);

    ctx.fillStyle = `rgba(${brightness},${brightness},${brightness},${0.9})`;
    ctx.shadowColor = "rgba(255,255,255,0.8)";
    ctx.shadowBlur = 10 * intensity;

    ctx.fillRect(x, y, size, size);  }

    requestAnimationFrame(update);
}

window.addEventListener("resize", resize);
resize();
update();

/* ===============================
   ANIMATION TRIGGER
================================ */
requestAnimationFrame(() => {
  document.getElementById("scene").classList.add("animate");
});

/* ===============================
   EXIT
================================ */
function exitFeed() {
  window.location.href = "profile.html";
}

/* ===============================
   FEED LOGIC
================================ */
const feed = document.getElementById("feed");
let allLogs = JSON.parse(localStorage.getItem("allLogs")) || [];
let visibleCount = 50;

allLogs.sort((a, b) => b.timestamp - a.timestamp);

function renderFeed() {
  feed.innerHTML = "";

  allLogs.slice(0, visibleCount).forEach(log => {
    const post = document.createElement("div");
    post.className = "post";
    post.onclick = () => openLog(log.id);

    post.innerHTML = `
      <div class="username" onclick="event.stopPropagation(); viewProfile('${log.username}')">
        ${log.username}
      </div>
      <div class="post-text">${log.text}</div>
      <div class="actions">
        <button onclick="event.stopPropagation(); likePost('${log.id}')">
          ❤️ ${log.likes || 0}
        </button>
        <button onclick="event.stopPropagation(); commentPost('${log.id}')">
          💬 ${(log.comments || []).length}
        </button>
      </div>
    `;

    feed.appendChild(post);
  });

  if (visibleCount < allLogs.length) {
    const loadMore = document.createElement("div");
    loadMore.className = "load-more";
    loadMore.innerHTML = `<button onclick="loadMore()">Load more logs</button>`;
    feed.appendChild(loadMore);
  }
}

function loadMore() {
  visibleCount += 50;
  renderFeed();
}

function likePost(id) {
  const log = allLogs.find(l => l.id === id);
  log.likes = (log.likes || 0) + 1;
  save();
}

function commentPost(id) {
  const text = prompt("Enter comment:");
  if (!text) return;
  const log = allLogs.find(l => l.id === id);
  log.comments = log.comments || [];
  log.comments.push({ user: "Anonymous", text });
  save();
}

function save() {
  localStorage.setItem("allLogs", JSON.stringify(allLogs));
  renderFeed();
}

/* ===============================
   NAVIGATION
================================ */
function viewProfile(username) {
  localStorage.setItem("viewUser", username);
  window.location.href = "viewprofile.html";
}

function openLog(id) {
  localStorage.setItem("activeLogId", id);
  window.location.href = "detailedlog.html";
}

renderFeed();
</script>

</body>
</html>
