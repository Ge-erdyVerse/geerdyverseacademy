<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Photography Session — Geerdyverse</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --void-black:#0b0710;
      --nebula-purple:#221324;
      --paper-light:#fffef8;
      --accent-violet:#7c5cff;
      --accent-rose:#ff7ac4;
      --text-dark:#2b163a;
      --text-muted:#6e5b7b;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:'Inter',system-ui,sans-serif;
      background:linear-gradient(180deg,var(--void-black),var(--nebula-purple));
      color:var(--paper-light);
      line-height:1.6;
    }

    .stars{
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,.2), transparent);
      background-size:260px 260px;
      animation:drift 160s linear infinite;
      z-index:0;
    }

    @keyframes drift{
      from{transform:translateY(0);}
      to{transform:translateY(-350px);}
    }

    body > *{ position:relative; z-index:1; }

    /* NAV */
    .nav{
      position:sticky;
      top:0;
      background:rgba(11,7,16,.85);
      backdrop-filter:blur(10px);
    }
    .nav-inner{
      max-width:1100px;
      margin:auto;
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .logo{
      font-family:'Poppins',sans-serif;
      font-weight:600;
    }
    .nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:.9rem;
    }

    /* HERO */
    .hero{
      text-align:center;
      padding:90px 20px 40px;
    }
    .hero h1{
      font-family:'Poppins',sans-serif;
      font-size:2.4rem;
    }
    .hero p{
      max-width:650px;
      margin:auto;
      color:#e2e2e2;
    }

    /* PANEL */
    .panel{
      background:var(--paper-light);
      color:var(--text-dark);
      max-width:800px;
      margin:60px auto;
      padding:50px;
      border-radius:20px;
    }

    .panel h2{
      font-family:'Poppins',sans-serif;
      margin-top:0;
      text-align:center;
    }

    /* FORM */
    label{
      display:block;
      font-weight:500;
      margin:14px 0 6px;
    }

    input, textarea, select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:.95rem;
      margin-bottom:10px;
      font-family:'Inter',sans-serif;
    }

    textarea{
      height:130px;
      resize:vertical;
    }

    /* CTA */
    .cta{
      text-align:center;
      margin-top:30px;
    }

    .cta-btn{
      padding:14px 34px;
      border:none;
      border-radius:28px;
      background:linear-gradient(135deg,var(--accent-violet),var(--accent-rose));
      color:white;
      font-size:.95rem;
      cursor:pointer;
    }

    footer{
      text-align:center;
      padding:40px 20px;
      font-size:.8rem;
      color:#aaa;
    }
  </style>
</head>

<body>

<div class="stars"></div>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">Geerdyverse</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="academy.html">Academy</a>
      <a href="tools.html">Tools</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Book a Photography Session</h1>
  <p>Tell us about the kind of photoshoot you want. You’ll receive a response within 24 hours with details and pricing.</p>
</section>

<section class="panel">

  <h2>Photography Request Form</h2>

  <form onsubmit="submitForm(event)">

    <label>Your Name</label>
    <input type="text" name="name" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label>Type of Photoshoot</label>
    <select name="shoot_type" required>
      <option value="">Select a type</option>
      <option>Portrait Shoot</option>
      <option>Outdoor / Location Shoot</option>
      <option>Product Photography</option>
      <option>Event / Mini Coverage</option>
      <option>Other (Explain Below)</option>
    </select>

    <label>Photoshoot Description</label>
    <textarea name="description" placeholder="Explain the theme, setting, mood, outfit ideas or purpose." required></textarea>

    <label>Reference Links (Optional)</label>
    <textarea name="references" placeholder="Paste moodboards, example images, location ideas etc."></textarea>

    <label>Preferred Date or Time Range (Optional)</label>
    <input type="text" name="date" placeholder="Example: Weekend, specific date, anytime">

    <div class="cta">
      <button class="cta-btn" type="submit">Submit Photography Request</button>
    </div>

  </form>

</section>

<footer>
  <p>© 2025 Geerdyverse • Photography Request</p>
</footer>

<script>
async function submitForm(event) {
  event.preventDefault();

  const form = event.target;

  const payload = {
    name: form.name.value,
    email: form.email.value,
    shoot_type: form.shoot_type.value,
    description: form.description.value,
    references: form.references.value,
    date: form.date.value
  };

  const response = await fetch("https://geerdyverse-backend.onrender.com/api/photo-submissions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await response.json();

  alert(data.message || "Something went wrong");
}
</script>

</body>
</html>
